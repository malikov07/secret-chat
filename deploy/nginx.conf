# Secret Chat — nginx site config.
# Install: copy to /etc/nginx/sites-available/secret-chat, edit server_name,
# then: ln -s /etc/nginx/sites-available/secret-chat /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;   # e.g. secret.example.com  or  20.30.40.50

    client_max_body_size 200M;       # allow large photo/video uploads

    # Built React app + Django admin static (produced by collectstatic)
    location /static/ {
        alias /opt/secret-chat/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # User-uploaded media (photos, videos, voice notes, video-notes).
    # MUST match MEDIA_ROOT in backend/.env (default in env.prod.example).
    location /media/ {
        alias /var/secret-chat/media/;
        access_log off;
        expires 7d;
    }

    # WebSockets: chat, presence, live camera/location signaling
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;    # keep long-lived sockets open
    }

    # Everything else -> daphne (Django API + the React SPA)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
