<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ao33 heart">
  <defs>
    <!-- Warm romantic background -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9dc0"/>
      <stop offset="0.52" stop-color="#e5608f"/>
      <stop offset="1" stop-color="#c62f76"/>
    </linearGradient>
    <!-- Heart fill: white with a faint blush -->
    <linearGradient id="heart" x1="256" y1="100" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe6f0"/>
    </linearGradient>
    <!-- Top sheen on the tile -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a0f3f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#sheen)"/>

  <!-- Heart -->
  <path filter="url(#soft)" fill="url(#heart)" d="M256 404
    C150 324 96 254 96 184
    C96 139 130 109 172 109
    C205 109 235 132 256 166
    C277 132 307 109 340 109
    C382 109 416 139 416 184
    C416 254 362 324 256 404 Z"/>

  <!-- Gloss highlight on the upper-left lobe -->
  <path fill="#ffffff" fill-opacity="0.55" d="M168 150
    C150 150 135 164 134 184
    C133 200 140 214 152 222
    C150 196 156 172 176 158
    C174 153 171 150 168 150 Z"/>

  <!-- Little sparkle -->
  <path fill="#ffffff" fill-opacity="0.9" d="M366 150
    C368 168 372 172 390 174
    C372 176 368 180 366 198
    C364 180 360 176 342 174
    C360 172 364 168 366 150 Z"/>
</svg>
